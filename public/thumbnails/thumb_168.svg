<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#9333ea" opacity="0.12" />
    </pattern>
  </defs>
  
  <!-- Card Background -->
  <rect width="600" height="375" fill="url(#bgGrad)" />
  <rect width="600" height="375" fill="url(#dots)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="600" height="10" fill="#9333ea" />

  <!-- Corner Decor -->
  <circle cx="560" cy="40" r="70" fill="#9333ea" opacity="0.08" />
  <circle cx="560" cy="40" r="45" fill="#9333ea" opacity="0.12" />

  <!-- Category Badge -->
  <rect x="40" y="45" width="auto" height="34" rx="8" fill="#9333ea" />
  <text x="54" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">
    💡  創作(Creation)
  </text>

  <!-- Big Central Emoji / Icon Area -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#9333ea" stroke-width="3" opacity="0.9" />
    <text x="0" y="16" text-anchor="middle" font-size="46">💡</text>
  </g>

  <!-- Tool Title Text -->
  <g transform="translate(42, 160)">
    
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif" font-size="30" font-weight="900" fill="#1e2a38">
        Puti-AI 火焰粒子
      </text>
    
      <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif" font-size="30" font-weight="900" fill="#1e2a38">
        Q版故事生圖器
      </text>
    
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="42" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#9333ea" letter-spacing="1">
    ⚡ PUTI-AI TEACHING TOOLS
  </text>
</svg>